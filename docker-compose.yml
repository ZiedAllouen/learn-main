services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bsmk
      POSTGRES_PASSWORD: bsmk_dev
      POSTGRES_DB: bsmk_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bsmk -d bsmk_dev']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
